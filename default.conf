server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # SEGURIDAD: Ocultar la versión exacta de Nginx en los errores
    server_tokens off;

    # CABECERAS DE SEGURIDAD HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # LÍMITES Y TIMEOUTS
    client_max_body_size 64M;
    client_body_timeout 120s;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;

    # Regla MVC para rutas virtuales (/login, /dashboard)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloquear acceso directo a archivos sensibles u ocultos (.env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Archivos estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }

    # Procesar PHP
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}