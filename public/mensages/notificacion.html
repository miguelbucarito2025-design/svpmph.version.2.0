<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notificación Institucional - SVPMPH</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #f1f5f9; padding: 40px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            "
          >
            <!-- Cabecera institucional -->
            <tr>
              <td
                style="
                  background-color: #0f172a;
                  padding: 30px;
                  text-align: center;
                "
              >
                <h1
                  style="
                    color: #ffffff;
                    margin: 0;
                    font-size: 22px;
                    font-weight: 700;
                    letter-spacing: 1px;
                  "
                >
                  SVPMPH
                </h1>
                <p style="color: #94a3b8; margin: 6px 0 0 0; font-size: 13px">
                  Sociedad Venezolana de Profesionales en Medicina
                  Prehospitalaria
                </p>
              </td>
            </tr>

            <!-- Cuerpo central del mensaje -->
            <tr>
              <td style="padding: 40px 30px; text-align: left">
                <h2
                  style="
                    color: #1e293b;
                    font-size: 18px;
                    margin-top: 0;
                    font-weight: 600;
                  "
                >
                  {{TITULO}}
                </h2>
                <p
                  style="
                    color: #475569;
                    font-size: 15px;
                    line-height: 1.6;
                    margin-bottom: 15px;
                  "
                >
                  Estimado(a) <strong>{{NOMBRE_USUARIO}}</strong>,
                </p>
                <div
                  style="
                    background-color: #f8fafc;
                    border-left: 4px solid #0284c7;
                    padding: 16px;
                    border-radius: 4px;
                    color: #334155;
                    font-size: 14px;
                    line-height: 1.6;
                    margin-bottom: 25px;
                  "
                >
                  {{MENSAJE}}
                </div>
                <p style="color: #64748b; font-size: 12px; margin: 0">
                  Fecha de registro: <strong>{{FECHA}}</strong>
                </p>
              </td>
            </tr>

            <!-- Pie de página -->
            <tr>
              <td
                style="
                  background-color: #f8fafc;
                  padding: 20px 30px;
                  text-align: center;
                  border-top: 1px solid #e2e8f0;
                "
              >
                <p
                  style="
                    color: #94a3b8;
                    font-size: 11px;
                    margin: 0;
                    line-height: 1.4;
                  "
                >
                  Este es un mensaje automatizado generado por los servidores de
                  la SVPMPH. Por favor, no responda directamente a este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
